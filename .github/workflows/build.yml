          package com.guvenlik.app

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.content.Intent
          import android.net.VpnService
          import android.os.ParcelFileDescriptor
          import java.io.FileInputStream
          import java.io.FileOutputStream
          import java.net.DatagramPacket
          import java.net.DatagramSocket
          import java.net.InetAddress
          import java.util.concurrent.ExecutorService
          import java.util.concurrent.Executors

          /**
           * Yalnızca DNS trafiğini yakalayan yerel VPN.
           * - Engelli alan adları için "yok" cevabı döner.
           * - Diğer sorgular yetişkin içerik filtreli DNS'e iletilir.
           * Bağlantı hangi ağdan (Wi-Fi, mobil veri) gelirse gelsin çalışır.
           */
          class GuardVpnService : VpnService() {

              companion object {
                  const val ACTION_STOP = "com.guvenlik.app.STOP"
                  private const val CHANNEL = "g"
                  private const val FAKE_DNS = "10.111.0.2"
                  private val UPSTREAM = arrayOf("185.228.168.10", "185.228.169.11")
              }

              private var tun: ParcelFileDescriptor? = null
              @Volatile private var running = false
              private var worker: Thread? = null
              private val pool: ExecutorService = Executors.newFixedThreadPool(8)

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  showNotification()
                  if (intent?.action == ACTION_STOP || !Prefs.isActive(this)) {
                      shutdown()
                      stopForeground(STOP_FOREGROUND_REMOVE)
                      stopSelf()
                      return START_NOT_STICKY
                  }
                  if (!running) startVpn()
                  return START_STICKY
              }

              override fun onRevoke() {
                  shutdown()
                  super.onRevoke()
              }

              override fun onDestroy() {
                  shutdown()
                  super.onDestroy()
              }

              private fun showNotification() {
                  val nm = getSystemService(NotificationManager::class.java)
                  nm.createNotificationChannel(
                      NotificationChannel(CHANNEL, "Güvenlik", NotificationManager.IMPORTANCE_MIN)
                  )
                  val n = Notification.Builder(this, CHANNEL)
                      .setContentTitle("Güvenlik")
                      .setContentText("Açık")
                      .setSmallIcon(R.drawable.ic_shield)
                      .setOngoing(true)
                      .build()
                  startForeground(1, n)
              }

              private fun startVpn() {
                  val builder = Builder()
                      .setSession("Güvenlik")
                      .addAddress("10.111.0.1", 32)
                      .addDnsServer(FAKE_DNS)
                      .addRoute(FAKE_DNS, 32)
                      .setBlocking(true)

                  val fd = try {
                      builder.establish()
                  } catch (e: Exception) {
                      null
                  }
                  if (fd == null) {
                      stopSelf()
                      return
                  }
                  tun = fd
                  running = true
                  worker = Thread { loop(fd) }.also { it.start() }
              }

              private fun shutdown() {
                  running = false
                  try {
                      tun?.close()
                  } catch (_: Exception) {
                  }
                  tun = null
                  worker?.interrupt()
                  worker = null
              }

              private fun loop(fd: ParcelFileDescriptor) {
                  val input = FileInputStream(fd.fileDescriptor)
                  val output = FileOutputStream(fd.fileDescriptor)
                  val buf = ByteArray(32767)
                  try {
                      while (running) {
                          val n = input.read(buf)
                          if (n < 0) break
                          if (n < 28) continue
                          handle(buf.copyOf(n), output)
                      }
                  } catch (_: Exception) {
                  }
              }

              private fun handle(p: ByteArray, out: FileOutputStream) {
                  if ((p[0].toInt() shr 4) != 4) return
                  val ihl = (p[0].toInt() and 0x0F) * 4
                  if (p[9].toInt() != 17 || p.size < ihl + 8) return

                  val srcPort = ((p[ihl].toInt() and 0xFF) shl 8) or (p[ihl + 1].toInt() and 0xFF)
                  val dstPort = ((p[ihl + 2].toInt() and 0xFF) shl 8) or (p[ihl + 3].toInt() and 0xFF)
                  if (dstPort != 53) return

                  val total = ((p[2].toInt() and 0xFF) shl 8) or (p[3].toInt() and 0xFF)
                  val end = minOf(total, p.size)
                  if (end <= ihl + 8) return

                  val srcIp = p.copyOfRange(12, 16)
                  val dstIp = p.copyOfRange(16, 20)
                  val query = p.copyOfRange(ihl + 8, end)

                  val q = parseQuestion(query)
                  if (q != null && Blocklist.isBlockedHost(q.first)) {
                      val resp = nxdomain(query, q.second)
                      write(out, buildUdp(dstIp, srcIp, 53, srcPort, resp))
                      return
                  }

                  pool.execute {
                      val resp = forward(query) ?: return@execute
                      write(out, buildUdp(dstIp, srcIp, 53, srcPort, resp))
                  }
              }

              /** Sorgudaki alan adını ve sorunun bittiği konumu döner. */
              private fun parseQuestion(d: ByteArray): Pair<String, Int>? {
                  if (d.size < 17) return null
                  var i = 12
                  val sb = StringBuilder()
                  while (i < d.size) {
                      val len = d[i].toInt() and 0xFF
                      if (len == 0) {
                          val qEnd = i + 1 + 4
                          if (qEnd > d.size) return null
                          return Pair(sb.toString(), qEnd)
                      }
                      if ((len and 0xC0) != 0 || i + 1 + len > d.size) return null
                      if (sb.isNotEmpty()) sb.append('.')
                      sb.append(String(d, i + 1, len, Charsets.ISO_8859_1))
                      i += 1 + len
                  }
                  return null
              }

              private fun nxdomain(query: ByteArray, qEnd: Int): ByteArray {
                  val r = query.copyOfRange(0, qEnd)
                  r[2] = (0x80 or (query[2].toInt() and 0x01)).toByte() // QR=1, RD korunur
                  r[3] = 0x83.toByte() // RA + NXDOMAIN
                  r[4] = 0
                  r[5] = 1
                  for (k in 6..11) r[k] = 0
                  return r
              }

              private fun forward(query: ByteArray): ByteArray? {
                  for (host in UPSTREAM) {
                      val s = DatagramSocket()
                      try {
                          protect(s)
                          s.soTimeout = 3500
                          s.send(DatagramPacket(query, query.size, InetAddress.getByName(host), 53))
                          val buf = ByteArray(4096)
                          val r = DatagramPacket(buf, buf.size)
                          s.receive(r)
                          return buf.copyOf(r.length)
                      } catch (_: Exception) {
                      } finally {
                          s.close()
                      }
                  }
                  return null
              }

              private fun write(out: FileOutputStream, pkt: ByteArray) {
                  synchronized(out) {
                      try {
                          out.write(pkt)
                      } catch (_: Exception) {
                      }
                  }
              }

              private fun buildUdp(
                  srcIp: ByteArray, dstIp: ByteArray, srcPort: Int, dstPort: Int, payload: ByteArray
              ): ByteArray {
                  val total = 20 + 8 + payload.size
                  val p = ByteArray(total)
                  p[0] = 0x45
                  p[2] = (total shr 8).toByte()
                  p[3] = total.toByte()
                  p[6] = 0x40
                  p[8] = 64
                  p[9] = 17
                  System.arraycopy(srcIp, 0, p, 12, 4)
                  System.arraycopy(dstIp, 0, p, 16, 4)
                  val cs = checksum(p, 0, 20)
                  p[10] = (cs shr 8).toByte()
                  p[11] = cs.toByte()
                  p[20] = (srcPort shr 8).toByte()
                  p[21] = srcPort.toByte()
                  p[22] = (dstPort shr 8).toByte()
                  p[23] = dstPort.toByte()
                  val ulen = 8 + payload.size
                  p[24] = (ulen shr 8).toByte()
                  p[25] = ulen.toByte()
                  System.arraycopy(payload, 0, p, 28, payload.size)
                  return p
              }

              private fun checksum(b: ByteArray, off: Int, len: Int): Int {
                  var sum = 0L
                  var i = off
                  while (i < off + len - 1) {
                      sum += (((b[i].toInt() and 0xFF) shl 8) or (b[i + 1].toInt() and 0xFF)).toLong()
                      i += 2
                  }
                  while ((sum shr 16) != 0L) {
                      sum = (sum and 0xFFFF) + (sum shr 16)
                  }
                  return (sum.inv() and 0xFFFF).toInt()
              }
          }
