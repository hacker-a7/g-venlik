          package com.guvenlik.app

          import android.accessibilityservice.AccessibilityService
          import android.os.Bundle
          import android.os.SystemClock
          import android.view.accessibility.AccessibilityEvent
          import android.view.accessibility.AccessibilityNodeInfo

          /**
           * Arama kutusuna / adres çubuğuna yazılan kelimeleri izler.
           * VPN, Tor veya özel DNS kullanılsa bile çalışır çünkü ekrandaki yazıya bakar.
           */
          class GuardAccessibilityService : AccessibilityService() {

              private var lastScan = 0L
              private var lastBlock = 0L

              // Yazı kontrolü sadece bu uygulamalarda yapılır (Chrome, Google, Tor)
              private val targets = setOf(
                  "com.android.chrome",
                  "com.chrome.beta",
                  "com.google.android.googlequicksearchbox",
                  "org.torproject.torbrowser",
                  "org.torproject.torbrowser_alpha"
              )

              private val urlHints =listOf("url", "search", "omnibox", "location_bar", "address", "query")

              override fun onAccessibilityEvent(e: AccessibilityEvent?) {
                  if (e == null || !Prefs.isActive(this)) return
                  val pkg = e.packageName?.toString() ?: return
                  if (pkg !in targets) return

                  if (e.eventType == AccessibilityEvent.TYPE_VIEW_TEXT_CHANGED) {
                      val t = e.text?.joinToString(" ") ?: ""
                      if (Blocklist.isBlockedText(t)) {
                          block(e.source)
                          return
                      }
                  }

                  val now = SystemClock.elapsedRealtime()
                  if (now - lastScan < 300) return
                  lastScan = now

                  val root = rootInActiveWindow ?: return
                  scan(root, 0, intArrayOf(0))
              }

              private fun scan(node: AccessibilityNodeInfo?, depth: Int, count: IntArray): Boolean {
                  if (node == null || depth > 25 || count[0] > 600) return false
                  count[0]++

                  val id = node.viewIdResourceName?.lowercase() ?: ""
                  val relevant = node.isEditable || urlHints.any { id.contains(it) }
                  if (relevant) {
                      val t = node.text?.toString()
                      if (t != null && Blocklist.isBlockedText(t)) {
                          block(node)
                          return true
                      }
                  }
                  for (i in 0 until node.childCount) {
                      if (scan(node.getChild(i), depth + 1, count)) return true
                  }
                  return false
              }

              private fun block(node: AccessibilityNodeInfo?) {
                  val now = SystemClock.elapsedRealtime()
                  if (now - lastBlock < 1500) return
                  lastBlock = now
                  try {
                      if (node != null && node.isEditable) {
                          val args = Bundle()
                          args.putCharSequence(AccessibilityNodeInfo.ACTION_ARGUMENT_SET_TEXT_CHARSEQUENCE, "")
                          node.performAction(AccessibilityNodeInfo.ACTION_SET_TEXT, args)
                      }
                  } catch (_: Exception) {
                  }
                  performGlobalAction(GLOBAL_ACTION_HOME)
              }

              override fun onInterrupt() {}
          }
