          package com.guvenlik.app

          import android.content.Context

          object Prefs {
              private fun sp(c: Context) = c.getSharedPreferences("g", Context.MODE_PRIVATE)

              fun isActive(c: Context): Boolean = sp(c).getBoolean("a", false)

