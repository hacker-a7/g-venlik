          package com.guvenlik.app

          import android.Manifest
          import android.app.Activity
          import android.app.AlertDialog
          import android.content.ComponentName
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.graphics.Color
          import android.graphics.drawable.GradientDrawable
          import android.net.VpnService
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import android.view.Gravity
          import android.view.ViewGroup
          import android.widget.Button
          import android.widget.ImageView
          import android.widget.LinearLayout
          import android.widget.Toast

          class MainActivity : Activity() {

              private val reqVpn = 100
              private var pendingStart = false

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  if (Build.VERSION.SDK_INT >= 33 &&
                      checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED
                  ) {
                      requestPermissions(arrayOf(Manifest.permission.POST_NOTIFICATIONS), 1)
                  }

                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER
                      setBackgroundColor(Color.parseColor("#F2F6FC"))
                      setPadding(dp(32), dp(32), dp(32), dp(32))
                  }

                  val logo = ImageView(this).apply {
                      setImageResource(R.drawable.ic_shield)
                      layoutParams = LinearLayout.LayoutParams(dp(160), dp(160)).apply {
                          bottomMargin = dp(48)
                      }
                  }

                  root.addView(logo)
                  root.addView(makeButton(getString(R.string.start), true) { startFlow() })
                  root.addView(makeButton(getString(R.string.stop), false) { confirmStop() })
                  setContentView(root)
              }

              override fun onResume() {
                  super.onResume()
                  if (pendingStart && isAccessibilityOn()) {
                      pendingStart = false
                      startFlow()
                  }
              }

              private fun startFlow() {
                  if (!isAccessibilityOn()) {
                      pendingStart = true
                      Toast.makeText(this, R.string.enable_hint, Toast.LENGTH_LONG).show()
                      startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                      return
                  }
                  val prep = VpnService.prepare(this)
                  if (prep != null) {
                      startActivityForResult(prep, reqVpn)
                  } else {
                      launchService()
                  }
              }

              @Deprecated("Deprecated in Java")
              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode == reqVpn && resultCode == RESULT_OK) launchService()
              }

              private fun launchService() {
                  Prefs.setActive(this, true)
                  startForegroundService(Intent(this, GuardVpnService::class.java))
              }

              private fun confirmStop() {
                  AlertDialog.Builder(this)
                      .setMessage(getString(R.string.confirm_message))
                      .setPositiveButton(R.string.stop) { _, _ -> doStop() }
                      .setNegativeButton(R.string.cancel, null)
                      .show()
              }

              private fun doStop() {
                  Prefs.setActive(this, false)
                  startService(Intent(this, GuardVpnService::class.java).setAction(GuardVpnService.ACTION_STOP))
              }

              private fun isAccessibilityOn(): Boolean {
                  val cn = ComponentName(this, GuardAccessibilityService::class.java)
                  val enabled = Settings.Secure.getString(
                      contentResolver, Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES
                  ) ?: return false
                  return enabled.split(':').any {
                      it.equals(cn.flattenToString(), true) || it.equals(cn.flattenToShortString(), true)
                  }
              }

              private fun makeButton(label: String, filled: Boolean, onClick: () -> Unit): Button {
                  val blue = Color.parseColor("#1565C0")
                  return Button(this).apply {
                      setText(label)
                      isAllCaps = false
                      textSize = 18f
                      setTextColor(if (filled) Color.WHITE else blue)
                      background = GradientDrawable().apply {
                          cornerRadius = dp(28).toFloat()
                          if (filled) {
                              setColor(blue)
                          } else {
                              setColor(Color.WHITE)
                              setStroke(dp(2), blue)
                          }
                      }
                      layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, dp(56)).apply {
                          topMargin = dp(16)
                      }
                      setOnClickListener { onClick() }
                  }
              }

              private fun dp(v: Int): Int = (v * resources.displayMetrics.density).toInt()
          }
