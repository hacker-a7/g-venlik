          package com.guvenlik.app

          import java.util.Locale

          /**
           * Kelime ve alan adı kontrolü.
           * Listeleri aşağıdan istediğin gibi genişletebilirsin.
           * Eşleştirme öncesi metin: küçük harfe çevrilir, Türkçe karakterler sadeleşir,
           * "p0rn0" gibi yazımlar düzeltilir ve art arda tekrar eden harfler teke indirilir
           * (poorno -> porno, sikkiiş -> sikis).
           */
          object Blocklist {
              private val TR = Locale("tr", "TR")

              // Kelimenin herhangi bir yerinde geçerse engellenir
              private val CONTAINS: List<String> = listOf(
                  "porn", "sikis", "sikik", "hentai", "erotik", "erotic",
                  "xvideos", "xnxx", "xhamster", "redtube", "youporn", "spankbang",
                  "chaturbate", "stripchat", "bongacams", "livejasmin", "brazzers",
                  "eporner", "motherless", "thumbzilla", "tnaflix", "hqporner",
                  "fapello", "onlyfans", "rule34", "nhentai", "camsoda"
              ).map { collapse(it) }

              // Kelime bu ifadeyle BAŞLIYORSA engellenir (sex, sexi, sexy, seks, seksi ...)
              private val STARTS: List<String> = listOf("sex", "seks").map { collapse(it) }

              // Tam kelime olarak eşleşirse engellenir
              private val WORDS: Set<String> = setOf("nsfw", "bdsm", "cam4", "tube8").map { collapse(it) }.toSet()

              // Türkçe karakterli, tam kelime eşleşmesi (ö korunur, "got" gibi kelimeler etkilenmez)
              private val RAW_WORDS: Set<String> = setOf("göt", "götü", "götünü", "götüne", "götten")

              private val WS = Regex("\\s+")
              private val NON_ALNUM = Regex("[^a-z0-9]+")
              private val NON_LETTER = Regex("[^\\p{L}]+")
              private val XXX = Regex("^x{3,}$")

              private fun normalize(s: String): String {
                  val sb = StringBuilder(s.length)
                  for (ch in s.lowercase(TR)) {
                      val m = when (ch) {
                          'ı' -> 'i'
                          'ö' -> 'o'
                          'ü' -> 'u'
                          'ş' -> 's'
                          'ç' -> 'c'
                          'ğ' -> 'g'
                          '0' -> 'o'
                          '1' -> 'i'
                          '3' -> 'e'
                          '@' -> 'a'
                          '$' -> 's'
                          else -> ch
                      }
                      sb.append(m)
                  }
                  return sb.toString()
              }

              private fun collapse(s: String): String {
                  val sb = StringBuilder(s.length)
                  for (ch in s) {
                      if (sb.isEmpty() || sb[sb.length - 1] != ch) sb.append(ch)
                  }
                  return sb.toString()
              }

              /** Arama kutusu / adres çubuğu metni için. */
              fun isBlockedText(raw: String?): Boolean {
                  if (raw.isNullOrBlank()) return false
                  val text = if (raw.length > 500) raw.substring(0, 500) else raw

                  for (t in text.lowercase(TR).split(NON_LETTER)) {
                      if (t in RAW_WORDS) return true
                  }

                  val norm = normalize(text)

                  // Boşlukla ayrılmış parçalar: "p.o.r.n.o" gibi araya işaret konan yazımları yakalar
                  for (ws in norm.split(WS)) {
                      val joined = collapse(ws.filter { it.isLetterOrDigit() })
                      if (joined.isEmpty()) continue
                      for (k in CONTAINS) {
                          if (joined.contains(k)) return true
                      }
                  }

                  // Harf/rakam dışındakilerle bölünmüş parçalar
                  for (t in norm.split(NON_ALNUM)) {
                      if (t.isEmpty()) continue
                      if (XXX.matches(t)) return true
                      val c = collapse(t)
                      if (c in WORDS) return true
                      for (s in STARTS) {
                          if (c.startsWith(s)) return true
                      }
                  }
                  return false
              }

              /** DNS sorgusundaki alan adı için. */
              fun isBlockedHost(host: String): Boolean {
                  val h = host.lowercase(Locale.ROOT).trimEnd('.')
                  if (h.isEmpty()) return false
                  if (h.endsWith(".xxx") || h.endsWith(".adult") || h.endsWith(".porn") || h.endsWith(".sex")) return true
                  return isBlockedText(h.replace('.', ' ').replace('-', ' ').replace('_', ' '))
              }
          }
